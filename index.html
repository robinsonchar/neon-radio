<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NEON FM · Radio Online</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:   #ff2d78;
      --cyan:   #00f5ff;
      --purple: #bf00ff;
      --amber:  #ffb800;
      --green:  #00ff9d;
      --dark:   #04000d;
      --card:   rgba(8, 0, 20, 0.82);
      --glow-pink:  0 0 8px #ff2d78, 0 0 24px #ff2d7866;
      --glow-cyan:  0 0 8px #00f5ff, 0 0 24px #00f5ff66;
      --glow-green: 0 0 8px #00ff9d, 0 0 20px #00ff9d55;
    }

    html, body {
      height: 100%;
      background: var(--dark);
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
    }

    /* ── FONDO ARTWORK DIFUMINADO ─────────────────────── */
    #bg-art {
      position: fixed; inset: 0; z-index: 0;
      background-size: cover; background-position: center;
      filter: blur(60px) brightness(0.25) saturate(2);
      transform: scale(1.12);
      transition: background-image 2s ease;
    }
    #bg-overlay {
      position: fixed; inset: 0; z-index: 1;
      background:
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(191,0,255,0.12) 0%, transparent 70%),
        linear-gradient(180deg, rgba(4,0,13,0.7) 0%, rgba(4,0,13,0.15) 50%, rgba(4,0,13,0.88) 100%);
    }

    /* ── GRID RETRO ───────────────────────────────────── */
    #grid {
      position: fixed; inset: 0; z-index: 2;
      pointer-events: none; overflow: hidden;
    }
    #grid svg { width: 100%; height: 100%; }

    /* ── SCANLINES ────────────────────────────────────── */
    #scanlines {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      background: repeating-linear-gradient(
        0deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px,
        transparent 1px, transparent 3px
      );
    }

    /* ── LAYOUT ───────────────────────────────────────── */
    #app {
      position: relative; z-index: 10;
      height: 100svh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 20px 16px;
      gap: 0;
    }

    /* ── CABECERA EMISORA ─────────────────────────────── */
    .station-header {
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: clamp(16px, 3vh, 28px);
    }
    .station-name {
      font-family: 'Orbitron', sans-serif; font-weight: 900;
      font-size: clamp(2.2rem, 7vw, 4rem);
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--cyan); text-shadow: var(--glow-cyan);
      line-height: 1;
      animation: flicker 11s infinite;
    }
    .station-name em { color: var(--pink); text-shadow: var(--glow-pink); font-style: normal; }
    .station-freq {
      font-family: 'Orbitron', sans-serif; font-weight: 400;
      font-size: clamp(0.75rem, 2.5vw, 1rem);
      letter-spacing: 0.45em; color: rgba(255,255,255,0.3);
      margin-top: 3px;
    }

    /* ── CARD RADIO ───────────────────────────────────── */
    .radio-card {
      background: var(--card);
      border: 1px solid rgba(0,245,255,0.18);
      border-radius: 8px;
      box-shadow:
        0 0 0 1px rgba(191,0,255,0.1),
        inset 0 0 60px rgba(0,0,0,0.5),
        0 20px 80px rgba(0,0,0,0.8);
      width: min(500px, 100%);
      overflow: hidden;
      backdrop-filter: blur(18px);
      position: relative;
    }
    .radio-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
      opacity: 0.55;
    }

    /* ── ARTWORK BAND ─────────────────────────────────── */
    .artwork-band {
      position: relative;
      width: 100%;
      height: clamp(140px, 28vw, 200px);
      overflow: hidden;
    }
    #artwork-cover {
      width: 100%; height: 100%; object-fit: cover;
      transition: opacity 0.8s ease;
      display: block;
    }
    .artwork-band::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg,
        rgba(4,0,13,0.1) 0%,
        rgba(4,0,13,0.0) 40%,
        rgba(4,0,13,0.85) 100%);
    }
    /* ON AIR badge sobre la imagen */
    .on-air-badge {
      position: absolute; top: 12px; left: 14px; z-index: 5;
      display: flex; align-items: center; gap: 7px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,45,120,0.45);
      border-radius: 3px; padding: 4px 10px;
      font-size: 0.65rem; letter-spacing: 0.22em;
      color: var(--pink); text-shadow: var(--glow-pink);
      text-transform: uppercase;
      backdrop-filter: blur(6px);
      opacity: 0; transition: opacity 0.4s;
    }
    .on-air-badge.visible { opacity: 1; }
    .on-air-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--pink); box-shadow: var(--glow-pink);
      animation: blink 1.1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.1;} }

    /* ── CUERPO RADIO ─────────────────────────────────── */
    .radio-body {
      padding: clamp(14px, 3vw, 22px) clamp(16px, 4vw, 28px) clamp(16px, 3vw, 22px);
      display: flex; flex-direction: column; gap: clamp(12px, 2.5vw, 18px);
    }

    /* ── TRACK INFO ───────────────────────────────────── */
    .track-block { width: 100%; }
    .now-playing-label {
      font-size: 0.58rem; letter-spacing: 0.35em;
      color: var(--green); text-shadow: var(--glow-green);
      text-transform: uppercase; margin-bottom: 5px;
      display: flex; align-items: center; gap: 7px;
    }
    .live-pill {
      background: rgba(0,255,157,0.12);
      border: 1px solid rgba(0,255,157,0.35);
      border-radius: 2px; padding: 1px 6px;
      font-size: 0.54rem; letter-spacing: 0.2em;
    }
    #track-title {
      font-family: 'Orbitron', sans-serif; font-weight: 700;
      font-size: clamp(0.78rem, 3vw, 1rem);
      letter-spacing: 0.05em; color: #fff;
      text-shadow: 0 0 14px rgba(255,255,255,0.22);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    #track-artist {
      font-size: clamp(0.65rem, 2.2vw, 0.74rem);
      letter-spacing: 0.18em; color: var(--pink);
      text-shadow: 0 0 8px rgba(255,45,120,0.45);
      text-transform: uppercase;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── VISUALIZADOR DE SEÑAL ────────────────────────── */
    .signal-row {
      display: flex; align-items: flex-end;
      gap: 3px; height: 36px; width: 100%;
    }
    .sig-bar {
      flex: 1; background: var(--cyan);
      border-radius: 2px 2px 0 0;
      opacity: 0.25;
      animation: sig 1s ease-in-out infinite alternate;
      transition: background 0.5s;
    }
    .sig-bar.playing {
      opacity: 1;
      box-shadow: 0 0 6px var(--cyan);
    }
    /* Colores degradados de izq a der */
    .sig-bar:nth-child(1)  { animation-duration:0.55s; animation-delay:0.00s; }
    .sig-bar:nth-child(2)  { animation-duration:0.72s; animation-delay:0.04s; }
    .sig-bar:nth-child(3)  { animation-duration:0.48s; animation-delay:0.08s; }
    .sig-bar:nth-child(4)  { animation-duration:0.81s; animation-delay:0.03s; }
    .sig-bar:nth-child(5)  { animation-duration:0.63s; animation-delay:0.12s; }
    .sig-bar:nth-child(6)  { animation-duration:0.44s; animation-delay:0.06s; }
    .sig-bar:nth-child(7)  { animation-duration:0.77s; animation-delay:0.15s; }
    .sig-bar:nth-child(8)  { animation-duration:0.58s; animation-delay:0.02s; }
    .sig-bar:nth-child(9)  { animation-duration:0.66s; animation-delay:0.09s; }
    .sig-bar:nth-child(10) { animation-duration:0.51s; animation-delay:0.18s; }
    .sig-bar:nth-child(11) { animation-duration:0.79s; animation-delay:0.05s; }
    .sig-bar:nth-child(12) { animation-duration:0.43s; animation-delay:0.13s; }
    .sig-bar:nth-child(13) { animation-duration:0.68s; animation-delay:0.07s; }
    .sig-bar:nth-child(14) { animation-duration:0.56s; animation-delay:0.11s; }
    .sig-bar:nth-child(15) { animation-duration:0.74s; animation-delay:0.16s; }
    .sig-bar:nth-child(16) { animation-duration:0.49s; animation-delay:0.03s; }
    .sig-bar:nth-child(17) { animation-duration:0.83s; animation-delay:0.14s; }
    .sig-bar:nth-child(18) { animation-duration:0.60s; animation-delay:0.08s; }
    .sig-bar:nth-child(19) { animation-duration:0.46s; animation-delay:0.10s; }
    .sig-bar:nth-child(20) { animation-duration:0.71s; animation-delay:0.17s; }
    @keyframes sig {
      from { height: 4px; }
      to   { height: 100%; }
    }

    /* ── CONTROLES RADIO ──────────────────────────────── */
    .controls-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 14px;
    }

    /* Botón ON/OFF principal */
    .power-btn {
      width: clamp(56px, 14vw, 68px);
      height: clamp(56px, 14vw, 68px);
      border-radius: 50%;
      border: 2px solid rgba(255,45,120,0.4);
      background: radial-gradient(circle at 35% 35%, rgba(255,45,120,0.15), rgba(0,0,0,0.6));
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      transition: all 0.25s;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }
    .power-btn svg { display: block; color: rgba(255,45,120,0.6); transition: color 0.25s; }
    .power-btn:hover { border-color: var(--pink); box-shadow: var(--glow-pink); }
    .power-btn:hover svg { color: var(--pink); }
    .power-btn.on {
      border-color: var(--pink);
      background: radial-gradient(circle at 35% 35%, rgba(255,45,120,0.28), rgba(0,0,0,0.55));
      box-shadow: var(--glow-pink), inset 0 0 20px rgba(255,45,120,0.1);
    }
    .power-btn.on svg { color: var(--pink); filter: drop-shadow(0 0 6px var(--pink)); }
    .power-btn:active { transform: scale(0.94); }

    /* Status texto */
    .status-block { flex: 1; min-width: 0; }
    #status-line {
      font-size: clamp(0.6rem, 2vw, 0.66rem);
      letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(255,255,255,0.2); line-height: 1.5;
    }
    #status-line.active { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
    #status-line.error  { color: #ff6b6b; }

    /* Volumen */
    .vol-block {
      display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
      flex-shrink: 0;
    }
    .vol-label {
      font-size: 0.56rem; letter-spacing: 0.22em;
      color: rgba(255,255,255,0.22); text-transform: uppercase;
    }
    #volume-slider {
      width: clamp(80px, 20vw, 110px);
      -webkit-appearance: none;
      height: 3px; background: rgba(255,255,255,0.1);
      border-radius: 2px; outline: none; cursor: pointer;
    }
    #volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--amber); box-shadow: 0 0 7px var(--amber);
      cursor: pointer;
    }

    /* ── FOOTER DIAL ──────────────────────────────────── */
    .dial-footer {
      padding: 10px clamp(16px, 4vw, 28px) clamp(12px, 2.5vw, 16px);
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: space-between;
    }
    .freq-display {
      font-family: 'Orbitron', sans-serif; font-weight: 600;
      font-size: clamp(1rem, 3.5vw, 1.3rem);
      letter-spacing: 0.12em;
      color: var(--amber);
      text-shadow: 0 0 10px rgba(255,184,0,0.6), 0 0 24px rgba(255,184,0,0.25);
    }
    .freq-band {
      font-size: clamp(0.55rem, 2vw, 0.62rem); letter-spacing: 0.3em;
      color: rgba(255,255,255,0.25); text-transform: uppercase;
      margin-top: 2px;
    }
    /* Indicador de señal (barras de recepción) */
    .signal-strength {
      display: flex; align-items: flex-end; gap: 3px; height: 18px;
    }
    .ss-bar {
      width: 5px; border-radius: 1px;
      background: var(--green);
    }
    .ss-bar:nth-child(1) { height: 5px;  opacity: 0.9; }
    .ss-bar:nth-child(2) { height: 8px;  opacity: 0.9; }
    .ss-bar:nth-child(3) { height: 12px; opacity: 0.9; }
    .ss-bar:nth-child(4) { height: 16px; opacity: 0.5; }
    .ss-bar:nth-child(5) { height: 18px; opacity: 0.2; }

    /* ── IFRAME OCULTO ────────────────────────────────── */
    #sc-wrap { position: fixed; top:-9999px; left:-9999px; width:1px; height:1px; overflow:hidden; }

    /* ── ANIMACIONES GLOBALES ─────────────────────────── */
    @keyframes flicker {
      0%,93%,100%{opacity:1;} 94%{opacity:0.78;} 95%{opacity:1;} 97.5%{opacity:0.62;} 98%{opacity:1;}
    }

    /* ── RESPONSIVE EXTREMO ───────────────────────────── */
    @media (max-height: 580px) {
      .artwork-band { height: 100px; }
      .station-header { margin-bottom: 10px; }
    }
  </style>
</head>
<body>

<!-- CAPAS DE FONDO -->
<div id="bg-art"></div>
<div id="bg-overlay"></div>

<!-- GRID RETRO -->
<div id="grid">

<!-- IFRAME OCULTO -->
<div id="sc-wrap">
  <iframe id="sc-iframe" width="100%" height="166"
    scrolling="no" frameborder="no" allow="autoplay"
    src="about:blank"></iframe>
</div>

<!-- UI PRINCIPAL -->
<div id="app">

  <!-- CABECERA -->
  <div class="station-header">
    <div class="station-name">NEON <em>FM</em></div>
    <div class="station-freq">ELECTRONIC · HOUSE · ELECTRONICA</div>
  </div>

  <!-- TARJETA RADIO -->
  <div class="radio-card">

    <!-- ARTWORK + ON AIR -->
    <div class="artwork-band">
      <img id="artwork-cover"
        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 200'%3E%3Crect fill='%230a0018'/%3E%3C/svg%3E"
        alt=""/>

        <div id="track-artist">NEON FM</div>
      </div>

      <!-- VISUALIZADOR DE SEÑAL -->
      <div class="signal-row" id="signal-bars">
        <!-- generado por JS -->
      </div>

      <!-- CONTROLES -->
      <div class="controls-row">

        <!-- Botón ON/OFF -->
        <button class="power-btn" id="btn-power" title="Encender / Apagar">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
            <path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/>
          </svg>

          <div id="status-line">Pulsa para escuchar</div>

          <div class="vol-label">VOL</div>

    <!-- FOOTER DIAL -->
    <div class="dial-footer">
      <div>
        <div class="freq-display" id="freq-display">98.7 MHz</div>
        <div class="freq-band">FM Stereo</div>
      </div>
      <div class="signal-strength" id="signal-strength">
        <div class="ss-bar"></div>
        <div class="ss-bar"></div>
        <div class="ss-bar"></div>
        <div class="ss-bar"></div>
        <div class="ss-bar"></div>
      </div>
    </div>

  </div><!-- /radio-card -->
</div><!-- /app -->

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
(function () {

  /* ══════════════════════════════════════════════════
     CONFIG
  ══════════════════════════════════════════════════ */
  var PLAYLIST_URL = 'https://soundcloud.com/demoscott177/sets/electronic-house-electronica';

  /* ══════════════════════════════════════════════════
     DOM
  ══════════════════════════════════════════════════ */
  var iframe      = document.getElementById('sc-iframe');
  var bgArt       = document.getElementById('bg-art');
  var artworkCover= document.getElementById('artwork-cover');
  var titleEl     = document.getElementById('track-title');
  var artistEl    = document.getElementById('track-artist');
  var btnPower    = document.getElementById('btn-power');
  var statusEl    = document.getElementById('status-line');
  var onAirBadge  = document.getElementById('on-air');
  var volSlider   = document.getElementById('volume-slider');
  var sigRow      = document.getElementById('signal-bars');
  var sigStrength = document.getElementById('signal-strength');
  var freqDisplay = document.getElementById('freq-display');

  /* ══════════════════════════════════════════════════
     ESTADO
  ══════════════════════════════════════════════════ */
  var widget   = null;
  var ready    = false;
  var playing  = false;
  var playlist = [];
  var queue    = [];
  var qPos     = 0;

  /* ══════════════════════════════════════════════════
     VISUALIZADOR — 20 barras generadas
  ══════════════════════════════════════════════════ */
  (function buildBars() {
    for (var i = 0; i < 20; i++) {
      var b = document.createElement('div');
      b.className = 'sig-bar';
      sigRow.appendChild(b);
    }
  })();

  var allBars = sigRow.querySelectorAll('.sig-bar');

  function setBarsPlaying(on) {
    for (var i = 0; i < allBars.length; i++) {
      allBars[i].classList.toggle('playing', on);
      // color degradado cyan→purple cuando suena
      if (on) {
        var t = i / (allBars.length - 1);
        var r = Math.round((0 + t * 191));
        var g = Math.round((245 - t * 245));
        var bl= Math.round((255 - t * 0));
        allBars[i].style.background = 'rgb('+r+','+g+','+bl+')';
        allBars[i].style.boxShadow  = 'none';
      } else {
        allBars[i].style.background = '';
        allBars[i].style.boxShadow  = '';
      }
    }
  }

  /* ══════════════════════════════════════════════════
     SEÑAL DE RECEPCIÓN — animación al reproducir
  ══════════════════════════════════════════════════ */
  var ssBars = sigStrength.querySelectorAll('.ss-bar');
  function setSignal(level) { // level 0-5
    for (var i = 0; i < ssBars.length; i++) {
      ssBars[i].style.opacity = i < level ? '0.9' : '0.15';
      ssBars[i].style.background = i < level ? 'var(--green)' : 'rgba(255,255,255,0.3)';
    }
  }

  /* ══════════════════════════════════════════════════
     FRECUENCIA — animación al cambiar pista
  ══════════════════════════════════════════════════ */
  var freqBase = 98.7;
  function animateFreq() {
    var target = (88 + Math.random() * 20).toFixed(1);
    var steps  = 18;
    var cur    = freqBase;
    var step   = (parseFloat(target) - cur) / steps;
    var i = 0;
    var iv = setInterval(function () {
      cur += step;
      freqDisplay.textContent = cur.toFixed(1) + ' MHz';
      i++;
      if (i >= steps) {
        clearInterval(iv);
        freqBase = parseFloat(target);
        freqDisplay.textContent = freqBase.toFixed(1) + ' MHz';
      }
    }, 40);
  }

  /* ══════════════════════════════════════════════════
     HELPERS
  ══════════════════════════════════════════════════ */
  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className   = cls || '';
  }

  function setArtwork(url) {
    if (!url) return;
    var big = url.replace(/-large|-small|-tiny|-mini|-crop|-t67x67|-badge/g, '-t500x500');
    artworkCover.style.opacity = '0';
    bgArt.style.opacity = '0';
    setTimeout(function () {
      artworkCover.src = big;
      bgArt.style.backgroundImage = "url('" + big + "')";
      artworkCover.style.opacity = '1';
      bgArt.style.opacity = '1';
    }, 400);
  }

  function setPlayingState(on) {
    playing = on;
    btnPower.classList.toggle('on', on);
    setBarsPlaying(on);
    onAirBadge.classList.toggle('visible', on);
    setSignal(on ? 4 : 1);
    setStatus(on ? '▶  TRANSMITIENDO EN VIVO' : '⏸  PAUSADO', on ? 'active' : '');
  }

  /* ══════════════════════════════════════════════════
     SHUFFLE Fisher-Yates
  ══════════════════════════════════════════════════ */
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildQueue() {
    var idx = [];
    for (var i = 0; i < playlist.length; i++) idx.push(i);
    queue = shuffle(idx);
    qPos  = 0;
  }

  function nextTrack() {
    qPos++;
    if (qPos >= queue.length) { buildQueue(); } // nueva ronda aleatoria
    widget.skip(queue[qPos]);
  }

  /* ══════════════════════════════════════════════════
     INIT WIDGET
  ══════════════════════════════════════════════════ */
  function initWidget() {
    setStatus('Conectando…', '');
    setSignal(1);

    var src = 'https://w.soundcloud.com/player/?url='
      + encodeURIComponent(PLAYLIST_URL)
      + '&auto_play=false&hide_related=true&show_comments=false'
      + '&show_user=true&show_reposts=false&visual=false'
      + '&buying=false&sharing=false&download=false'
      + '&show_artwork=false&color=%23ff2d78';

    iframe.src = src;

    iframe.onload = function () {
      try {
        widget = SC.Widget(iframe);

        widget.bind(SC.Widget.Events.READY, function () {
          ready = true;
          widget.setVolume(parseInt(volSlider.value, 10));
          widget.getSounds(function (sounds) {
            playlist = sounds || [];
            buildQueue();
            setStatus('¡Listo!  Pulsa para escuchar', 'active');
            setSignal(2);
          });
        });

        widget.bind(SC.Widget.Events.PLAY, function () {
          setPlayingState(true);
          animateFreq();
          widget.getCurrentSound(function (s) {
            if (!s) return;
            titleEl.textContent  = s.title || '—';
            artistEl.textContent =
              (s.publisher_metadata && s.publisher_metadata.artist)
              || (s.user && s.user.username) || '—';
            var art = s.artwork_url || (s.user && s.user.avatar_url);
            if (art) setArtwork(art);
          });
        });

        widget.bind(SC.Widget.Events.PAUSE,  function () { setPlayingState(false); });

        widget.bind(SC.Widget.Events.FINISH, function () {
          setPlayingState(false);
          setTimeout(nextTrack, 900); // auto-avanza a la siguiente aleatoria
        });

        widget.bind(SC.Widget.Events.ERROR, function () {
          setStatus('Error de señal — reintentando…', 'error');
          setTimeout(nextTrack, 1500);
        });

      } catch (err) {
        setStatus('Error: ' + err.message, 'error');
        console.error(err);
      }
    };
  }

  /* ══════════════════════════════════════════════════
     CONTROLES
  ══════════════════════════════════════════════════ */
  btnPower.addEventListener('click', function () {
    if (!widget || !ready) return;
    widget.isPaused(function (paused) {
      if (paused) {
        widget.skip(queue[qPos]);   // arranca en la pista aleatoria actual
      } else {
        widget.pause();
      }
    });
  });

  volSlider.addEventListener('input', function () {
    if (widget && ready) widget.setVolume(parseInt(this.value, 10));
  });

  /* ══════════════════════════════════════════════════
     ARRANCAR
  ══════════════════════════════════════════════════ */
  initWidget();

})();
</script>
</body>
</html>
