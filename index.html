<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NEON RADIO</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --neon-pink:   #ff2d78;
      --neon-cyan:   #00f5ff;
      --neon-purple: #bf00ff;
      --bg-dark:     #06000f;
      --glow-pink:   0 0 8px #ff2d78, 0 0 22px #ff2d7888, 0 0 44px #ff2d7844;
      --glow-cyan:   0 0 8px #00f5ff, 0 0 22px #00f5ff88, 0 0 44px #00f5ff44;
      --card-w:      480px;
    }

    html { height: 100%; }
    body {
      min-height: 100%;
      background: var(--bg-dark);
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      overflow-x: hidden;
    }

    /* ── FONDO DIFUMINADO ─────────────────────────────────────── */
    #bg-art {
      position: fixed; inset: 0; z-index: 0;
      background-size: cover; background-position: center;
      filter: blur(52px) brightness(0.3) saturate(1.9);
      transform: scale(1.1);
      transition: background-image 1.5s ease;
    }
    #bg-overlay {
      position: fixed; inset: 0; z-index: 1;
      background: linear-gradient(180deg,
        rgba(6,0,15,0.62) 0%,
        rgba(13,0,32,0.22) 40%,
        rgba(6,0,15,0.92) 100%);
    }

    /* ── GRID RETRO ───────────────────────────────────────────── */
    #grid {
      position: fixed; inset: 0; z-index: 2;
      pointer-events: none; overflow: hidden;
    }
    #grid svg { width: 100%; height: 100%; }

    /* ── SCANLINES ────────────────────────────────────────────── */
    #scanlines {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.07) 0px, rgba(0,0,0,0.07) 1px,
        transparent 1px, transparent 3px
      );
    }

    /* ── LAYOUT PRINCIPAL ─────────────────────────────────────── */
    #app {
      position: relative; z-index: 10;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px 16px;
    }

    /* ── LOGO ─────────────────────────────────────────────────── */
    .logo {
      font-family: 'Orbitron', sans-serif; font-weight: 900;
      font-size: clamp(1.9rem, 6vw, 3.4rem);
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--neon-cyan); text-shadow: var(--glow-cyan);
      margin-bottom: 5px;
      animation: flicker 9s infinite;
    }
    .logo span { color: var(--neon-pink); text-shadow: var(--glow-pink); }
    .tagline {
      font-size: clamp(0.55rem, 2vw, 0.68rem);
      letter-spacing: 0.35em;
      color: rgba(255,255,255,0.33);
      text-transform: uppercase;
      margin-bottom: clamp(20px, 4vh, 36px);
      text-align: center;
    }

    /* ── CARD ─────────────────────────────────────────────────── */
    .card {
      background: rgba(10, 0, 26, 0.78);
      border: 1px solid rgba(0,245,255,0.2);
      border-radius: 6px;
      box-shadow:
        0 0 0 1px rgba(191,0,255,0.1),
        inset 0 0 50px rgba(0,0,0,0.45),
        0 12px 70px rgba(0,0,0,0.75);
      padding: clamp(20px, 4vw, 32px) clamp(18px, 5vw, 36px) clamp(18px, 3vw, 28px);
      width: min(var(--card-w), 100%);
      display: flex; flex-direction: column; align-items: center;
      gap: clamp(14px, 2.5vw, 20px);
      backdrop-filter: blur(16px);
      position: relative; overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
      opacity: 0.6;
    }

    /* ── AHORA REPRODUCIENDO ──────────────────────────────────── */
    .now-playing-row {
      display: flex; align-items: center; gap: 9px;
      width: 100%; justify-content: center;
    }
    #np-label {
      font-size: clamp(0.55rem, 2vw, 0.6rem);
      letter-spacing: 0.28em; color: rgba(255,255,255,0.22);
      text-transform: uppercase;
    }

    /* ── EQ BARS ──────────────────────────────────────────────── */
    .eq { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
    .eq-bar {
      width: 3px; background: var(--neon-cyan); border-radius: 1px;
      animation: eq-anim 0.8s ease-in-out infinite alternate; opacity: 0.32;
    }
    .eq-bar:nth-child(1){animation-duration:0.58s;}
    .eq-bar:nth-child(2){animation-duration:0.84s;animation-delay:0.11s;}
    .eq-bar:nth-child(3){animation-duration:0.5s; animation-delay:0.22s;}
    .eq-bar:nth-child(4){animation-duration:0.7s; animation-delay:0.06s;}
    .eq.playing .eq-bar { opacity: 1; box-shadow: 0 0 5px var(--neon-cyan); }
    @keyframes eq-anim { from{height:3px;} to{height:14px;} }

    /* ── ARTWORK + INFO (fila en pantallas anchas) ────────────── */
    .media-row {
      display: flex; align-items: center;
      gap: clamp(14px, 3vw, 24px);
      width: 100%;
    }

    .artwork-wrap {
      flex-shrink: 0;
      width: clamp(90px, 22vw, 148px);
      height: clamp(90px, 22vw, 148px);
      border-radius: 4px; overflow: hidden;
      border: 1px solid rgba(255,45,120,0.42);
      box-shadow: 0 0 26px rgba(255,45,120,0.26), 0 0 70px rgba(0,0,0,0.6);
      position: relative;
    }
    #artwork {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: opacity 0.7s ease;
    }
    .artwork-wrap::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,45,120,0.1) 0%, transparent 55%);
      pointer-events: none;
    }

    .track-info { flex: 1; min-width: 0; text-align: left; }
    #track-title {
      font-family: 'Orbitron', sans-serif; font-weight: 700;
      font-size: clamp(0.72rem, 2.5vw, 0.9rem);
      letter-spacing: 0.06em; color: #fff;
      text-shadow: 0 0 12px rgba(255,255,255,0.25);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 5px;
    }
    #track-artist {
      font-size: clamp(0.6rem, 2vw, 0.7rem);
      letter-spacing: 0.2em; color: var(--neon-pink);
      text-shadow: 0 0 8px rgba(255,45,120,0.5);
      text-transform: uppercase;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 8px;
    }
    #track-index {
      font-size: 0.58rem; letter-spacing: 0.15em;
      color: rgba(255,255,255,0.2);
    }

    /* ── PROGRESS ─────────────────────────────────────────────── */
    .progress-wrap { width: 100%; }
    .progress-bar-bg {
      width: 100%; height: 3px;
      background: rgba(255,255,255,0.09);
      border-radius: 2px; cursor: pointer;
    }
    #progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-pink));
      box-shadow: 0 0 9px var(--neon-pink);
      border-radius: 2px; transition: width 0.5s linear;
    }
    .time-row {
      display: flex; justify-content: space-between;
      margin-top: 5px; font-size: 0.6rem;
      color: rgba(255,255,255,0.28); letter-spacing: 0.1em;
    }

    /* ── CONTROLES ────────────────────────────────────────────── */
    .controls {
      display: flex; align-items: center;
      gap: clamp(12px, 3vw, 22px);
    }
    .btn {
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,0.48);
      transition: color 0.2s, transform 0.15s;
      padding: 6px;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover  { color: #fff; transform: scale(1.12); }
    .btn:active { transform: scale(0.95); }

    .btn.play-btn {
      width: clamp(48px, 12vw, 56px);
      height: clamp(48px, 12vw, 56px);
      border-radius: 50%;
      border: 1.5px solid rgba(255,45,120,0.42);
      color: var(--neon-pink);
      box-shadow: 0 0 18px rgba(255,45,120,0.18), inset 0 0 18px rgba(255,45,120,0.05);
      transition: all 0.2s;
    }
    .btn.play-btn:hover {
      border-color: var(--neon-pink);
      box-shadow: var(--glow-pink);
      transform: scale(1.07);
    }

    /* Botón shuffle activo */
    .btn.shuffle-btn { position: relative; }
    .btn.shuffle-btn.on { color: var(--neon-cyan); }
    .btn.shuffle-btn.on svg { filter: drop-shadow(0 0 5px var(--neon-cyan)); }
    .btn.shuffle-btn .dot {
      position: absolute; bottom: 2px;
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--neon-cyan);
      box-shadow: 0 0 5px var(--neon-cyan);
      display: none;
    }
    .btn.shuffle-btn.on .dot { display: block; }

    /* ── VOLUMEN ──────────────────────────────────────────────── */
    .volume-row { width: 100%; display: flex; align-items: center; gap: 10px; }
    .vol-icon { color: rgba(255,255,255,0.28); flex-shrink: 0; }
    #volume-slider {
      flex: 1; -webkit-appearance: none;
      height: 3px; background: rgba(255,255,255,0.1);
      border-radius: 2px; outline: none; cursor: pointer;
    }
    #volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--neon-cyan);
      box-shadow: 0 0 7px var(--neon-cyan); cursor: pointer;
    }

    /* ── STATUS ───────────────────────────────────────────────── */
    #status {
      font-size: clamp(0.58rem, 2vw, 0.62rem);
      letter-spacing: 0.2em; color: rgba(255,255,255,0.22);
      text-transform: uppercase; min-height: 14px;
      text-align: center;
    }
    #status.active { color: var(--neon-cyan); text-shadow: 0 0 8px var(--neon-cyan); }
    #status.error  { color: #ff6b6b; }

    /* ── IFRAME OCULTO ────────────────────────────────────────── */
    #sc-wrap {
      position: fixed; top: -9999px; left: -9999px;
      width: 1px; height: 1px; overflow: hidden;
    }

    /* ── ANIMACIONES ──────────────────────────────────────────── */
    @keyframes flicker {
      0%,94%,100%{opacity:1;} 95%{opacity:0.8;} 96%{opacity:1;} 98%{opacity:0.65;} 99%{opacity:1;}
    }

    /* ── RESPONSIVE: pantallas muy pequeñas ───────────────────── */
    @media (max-width: 380px) {
      .media-row { flex-direction: column; align-items: center; }
      .track-info { text-align: center; }
      #track-title, #track-artist { white-space: normal; text-align: center; }
    }
  </style>
</head>

<script>
(function () {

  /* ════════════════════════════════════════════════════════
     CONFIGURACIÓN
  ════════════════════════════════════════════════════════ */
  var PLAYLIST_URL = 'https://soundcloud.com/demoscott177/sets/electronic-house-electronica';

  /* ════════════════════════════════════════════════════════
     DOM
  ════════════════════════════════════════════════════════ */
  var iframe      = document.getElementById('sc-iframe');
  var bgArt       = document.getElementById('bg-art');
  var artworkEl   = document.getElementById('artwork');
  var titleEl     = document.getElementById('track-title');
  var artistEl    = document.getElementById('track-artist');
  var indexEl     = document.getElementById('track-index');
  var btnPlay     = document.getElementById('btn-play');
  var iconPlay    = document.getElementById('icon-play');
  var iconPause   = document.getElementById('icon-pause');
  var btnPrev     = document.getElementById('btn-prev');
  var btnNext     = document.getElementById('btn-next');
  var btnShuffle  = document.getElementById('btn-shuffle');
  var progFill    = document.getElementById('progress-fill');
  var timeCur     = document.getElementById('time-cur');
  var timeDur     = document.getElementById('time-dur');
  var volSlider   = document.getElementById('volume-slider');
  var statusEl    = document.getElementById('status');
  var eqBars      = document.getElementById('eq-bars');
  var npLabel     = document.getElementById('np-label');
  var progBar     = document.getElementById('progress-bar');

  /* ════════════════════════════════════════════════════════
     ESTADO
  ════════════════════════════════════════════════════════ */
  var widget    = null;
  var duration  = 0;
  var ready     = false;
  var shuffleOn = true;          // shuffle activo por defecto
  var playlist  = [];            // copia de los tracks
  var queue     = [];            // orden aleatorio a reproducir
  var queuePos  = 0;             // posición actual en la queue

  /* ════════════════════════════════════════════════════════
     HELPERS
  ════════════════════════════════════════════════════════ */
  function fmt(ms) {
    var s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2);
  }

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className   = cls || '';
  }

  function setArtwork(url) {
    if (!url) return;
    var big = url.replace(/-large|-small|-tiny|-mini|-crop|-t67x67|-badge/g, '-t500x500');
    artworkEl.style.opacity = '0';
    setTimeout(function () {
      artworkEl.src = big;
      bgArt.style.backgroundImage = "url('" + big + "')";
      artworkEl.style.opacity = '1';
    }, 350);
  }

  function setPlaying(playing) {
    iconPlay.style.display  = playing ? 'none'  : 'block';
    iconPause.style.display = playing ? 'block' : 'none';
    eqBars.classList.toggle('playing', playing);
    npLabel.textContent = playing ? 'Reproduciendo' : 'En pausa';
    setStatus(playing ? '▶  TRANSMITIENDO' : '⏸  PAUSADO', playing ? 'active' : '');
  }

  /* ════════════════════════════════════════════════════════
     SHUFFLE — algoritmo Fisher-Yates
  ════════════════════════════════════════════════════════ */
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildQueue(currentIndex) {
    if (!shuffleOn) {
      // sin shuffle: orden normal desde la posición actual
      queue = [];
      for (var i = 0; i < playlist.length; i++) queue.push(i);
      queuePos = (currentIndex !== undefined) ? currentIndex : 0;
    } else {
      // con shuffle: orden aleatorio (el current va al frente si se especifica)
      var indices = [];
      for (var i = 0; i < playlist.length; i++) {
        if (i !== currentIndex) indices.push(i);
      }
      queue = (currentIndex !== undefined)
        ? [currentIndex].concat(shuffle(indices))
        : shuffle(indices.concat(currentIndex !== undefined ? [] : []));
      if (currentIndex === undefined) queue = shuffle(queue.concat ? queue : [].concat(queue));
      queuePos = 0;
    }
  }

  function playTrackAt(qPos) {
    if (!widget || !ready) return;
    queuePos = qPos;
    if (queuePos < 0)              queuePos = queue.length - 1;
    if (queuePos >= queue.length)  queuePos = 0;
    widget.skip(queue[queuePos]);
  }

  /* ════════════════════════════════════════════════════════
     INICIALIZAR WIDGET
  ════════════════════════════════════════════════════════ */
  function initWidget() {
    var src = 'https://w.soundcloud.com/player/?url='
      + encodeURIComponent(PLAYLIST_URL)
      + '&auto_play=false&hide_related=true&show_comments=false'
      + '&show_user=true&show_reposts=false&visual=false'
      + '&buying=false&sharing=false&download=false'
      + '&show_artwork=false&color=%23ff2d78';

    iframe.src = src;
    setStatus('Conectando con SoundCloud…', '');

    iframe.onload = function () {
      try {
        widget = SC.Widget(iframe);

        /* READY */
        widget.bind(SC.Widget.Events.READY, function () {
          ready = true;
          widget.setVolume(parseInt(volSlider.value, 10));

          // Obtener todos los tracks y construir la queue aleatoria
          widget.getSounds(function (sounds) {
            playlist = sounds || [];
            buildQueue(); // shuffle inicial sin current definido
            setStatus('¡Listo!  Pulsa  ▶  para reproducir', 'active');
          });
        });

        /* PLAY */
        widget.bind(SC.Widget.Events.PLAY, function () {
          setPlaying(true);
          widget.getCurrentSoundIndex(function (idx) {
            // Sincronizar queuePos con el índice real
            for (var i = 0; i < queue.length; i++) {
              if (queue[i] === idx) { queuePos = i; break; }
            }
            indexEl.textContent = 'Pista ' + (idx + 1) + ' / ' + playlist.length;
          });
          widget.getCurrentSound(function (sound) {
            if (!sound) return;
            titleEl.textContent  = sound.title || '—';
            artistEl.textContent =
              (sound.publisher_metadata && sound.publisher_metadata.artist)
              || (sound.user && sound.user.username) || '—';
            var art = sound.artwork_url || (sound.user && sound.user.avatar_url);
            if (art) setArtwork(art);
            widget.getDuration(function (d) {
              duration = d;
              timeDur.textContent = fmt(d);
            });
          });
        });

        /* PAUSA / FIN */
        widget.bind(SC.Widget.Events.PAUSE, function () { setPlaying(false); });

        /* Al terminar una pista → siguiente en la queue */
        widget.bind(SC.Widget.Events.FINISH, function () {
          setPlaying(false);
          progFill.style.width = '0%';
          timeCur.textContent  = '0:00';
          setTimeout(function () {
            playTrackAt(queuePos + 1);
          }, 800);
        });

        widget.bind(SC.Widget.Events.ERROR, function () {
          setStatus('Error al cargar la pista', 'error');
        });

        /* Progreso */
        widget.bind(SC.Widget.Events.PLAY_PROGRESS, function (e) {
          if (!duration) return;
          progFill.style.width = (e.currentPosition / duration * 100) + '%';
          timeCur.textContent  = fmt(e.currentPosition);
        });

      } catch (err) {
        setStatus('Error: ' + err.message, 'error');
        console.error(err);
      }
    };
  }

  /* ════════════════════════════════════════════════════════
     CONTROLES
  ════════════════════════════════════════════════════════ */

  /* Play / Pause */
  btnPlay.addEventListener('click', function () {
    if (!widget || !ready) return;
    widget.isPaused(function (paused) {
      if (paused) {
        // Si nunca arrancó, hacer skip al primer de la queue
        widget.getPosition(function (pos) {
          if (pos === 0) {
            widget.skip(queue[0]);
          } else {
            widget.play();
          }
        });
      } else {
        widget.pause();
      }
    });
  });

  /* Siguiente (respeta queue) */
  btnNext.addEventListener('click', function () {
    if (!widget || !ready) return;
    playTrackAt(queuePos + 1);
  });

  /* Anterior (respeta queue) */
  btnPrev.addEventListener('click', function () {
    if (!widget || !ready) return;
    // Si llevamos más de 3 s en la pista, vuelve al inicio; si no, pista anterior
    widget.getPosition(function (pos) {
      if (pos > 3000) {
        widget.seekTo(0);
      } else {
        playTrackAt(queuePos - 1);
      }
    });
  });

  /* Shuffle toggle */
  btnShuffle.addEventListener('click', function () {
    shuffleOn = !shuffleOn;
    btnShuffle.classList.toggle('on', shuffleOn);

    // Reconstruir la queue manteniendo la pista actual en la posición 0
    widget && widget.getCurrentSoundIndex(function (idx) {
      buildQueue(idx);
    });

    setStatus(shuffleOn ? 'Aleatorio: ON' : 'Aleatorio: OFF', 'active');
    setTimeout(function () {
      setStatus('▶  TRANSMITIENDO', 'active');
    }, 1500);
  });

  /* Volumen */
  volSlider.addEventListener('input', function () {
    if (widget && ready) widget.setVolume(parseInt(this.value, 10));
  });

  /* Seek en barra de progreso */
  progBar.addEventListener('click', function (e) {
    if (!widget || !ready || !duration) return;
    var r = progBar.getBoundingClientRect();
    widget.seekTo((e.clientX - r.left) / r.width * duration);
  });

  /* ════════════════════════════════════════════════════════
     ARRANCAR
  ════════════════════════════════════════════════════════ */
  initWidget();

})();
</script>
</body>
</html>
